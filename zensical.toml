# Documentation site, built by Zensical from the staged copy of README.md, CHANGELOG.md, llms.txt and docs/.
# Run `python .github/scripts/stage_docs.py` before `zensical build` or `zensical serve`.
[project]
site_url = "https://smalldi.readthedocs.io/"
site_name = "smalldi"
site_description = "Annotation-driven dependency injection for Python with zero runtime dependencies"
site_author = "Anna-Sofia Kasierocka"
repo_url = "https://github.com/0xf104a/smalldi"
repo_name = "0xf104a/smalldi"
docs_dir = "_docs"
strict = true

nav = [
  { "Overview" = "index.md" },
  { "Features" = [
    { "Features" = "docs/features/index.md" },
    { "Singletons" = "docs/features/singletons.md" },
    { "Interfaces and overrides" = "docs/features/interfaces.md" },
    { "Contexts" = "docs/features/contexts.md" },
    { "Containers" = "docs/features/containers.md" },
    { "Utilities" = "docs/features/utilities.md" },
  ] },
  { "Use cases" = [
    { "Use cases" = "docs/use-cases/index.md" },
    { "Wiring an application" = "docs/use-cases/wiring-an-application.md" },
    { "Swapping implementations" = "docs/use-cases/swapping-implementations.md" },
    { "Testing" = "docs/use-cases/testing.md" },
    { "Plugins and registries" = "docs/use-cases/plugins.md" },
    { "Threads and asyncio" = "docs/use-cases/threads-and-async.md" },
  ] },
  { "In depth" = [
    { "In depth" = "docs/index.md" },
    { "Architecture" = "docs/architecture.md" },
    { "Contexts" = "docs/contexts.md" },
    { "Concurrency" = "docs/concurrency.md" },
  ] },
  { "Migration" = [
    { "Migration" = "docs/migration/index.md" },
    { "0.2 to 0.3" = "docs/migration/0.2-to-0.3.md" },
    { "0.3 to 0.4" = "docs/migration/0.3-to-0.4.md" },
    { "0.2 to 0.4" = "docs/migration/0.2-to-0.4.md" },
  ] },
  { "API reference" = "api.md" },
  { "Changelog" = "CHANGELOG.md" },
]

extra_css = ["docs/assets/material3.css"]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Roboto"
code = "Fira Code"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/0xf104a/smalldi"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/smalldi/"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

[project.plugins.search]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
members_order = "source"
show_root_heading = false
show_root_toc_entry = false
show_source = false
show_signature_annotations = true
separate_signature = true
merge_init_into_class = true
filters = ["!^_"]
