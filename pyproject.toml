[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smalldi"
version = "0.5.0"
description = "Annotation-driven dependency injection for Python: decorators register singletons and interfaces, Provide[T] type hints inject them, overrides swap implementations, scoped contexts isolate tests."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Anna-Sofia Kasierocka", email = "f104a@f104a.io" }]
keywords = [
  "dependency injection", "di", "typing", "annotations",
  "dependency-injection", "inversion-of-control", "ioc", "singleton", "minimal", "lightweight",
  "decorators", "type-hints", "zero-dependency",
  "test-isolation", "testing", "mocking", "overrides", "interfaces", "context", "thread-safe",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: GraalPy",
  "Typing :: Typed",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Testing",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/0xf104a/smalldi"
Documentation = "https://smalldi.readthedocs.io/"
Changelog = "https://github.com/0xf104a/smalldi/blob/master/CHANGELOG.md"
Migration = "https://github.com/0xf104a/smalldi/blob/master/docs/migration/index.md"
Source = "https://github.com/0xf104a/smalldi"
Issues = "https://github.com/0xf104a/smalldi/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/smalldi"]
include = [
  "src/smalldi/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/CHANGELOG.md",
  "/docs",
]